---
# Publishing all NPM packages to the npm registry when the version number changes
# See https://github.com/marketplace/actions/npm-publish for more information
name: Publish Packages to npmjs

on:
  push:
    branches: test-npm-pub-trusted

env:
  # Set the Node.js version to use
  NODE_VERSION: '24'
  # Set the pnpm version to use
  PNPM_VERSION: '10'

permissions:
  id-token: write
  contents: read

jobs:
  # Publish the TypeScript bindings to the NPM registry
  publish-typescript-bindings:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          registry-url: "https://registry.npmjs.org"
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build-dist
      - name: Debug auth info
        # Disabled
        if: ${{ false }}
        run: |
          echo "Registry: $(npm config get registry)"
          env | grep ACTIONS_ID_TOKEN || echo "No OIDC env found"
          # npm whoami || echo "Expected fail: OIDC not visible via npm whoami"
      - name: Publish to NPM (debug)
        run: |
          set -euo pipefail

          echo "== Working directory =="
          pwd

          echo "== Local package.json =="
          node -e "const p=require('./package.json'); console.log({name:p.name, version:p.version})"

          LOCAL_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")

          echo "Local version: $LOCAL_VERSION"
          echo "Package name:  $PACKAGE_NAME"

          echo "== Registry check =="
          echo "Running: pnpm info $PACKAGE_NAME version"

          REMOTE_VERSION=$(pnpm info "$PACKAGE_NAME" version 2>/dev/null || echo "NOT_FOUND")
          echo "Remote version: $REMOTE_VERSION"

          if [ "$REMOTE_VERSION" = "$LOCAL_VERSION" ]; then
            echo "Version $LOCAL_VERSION already published, skipping."
            exit 0
          fi

          echo "== OIDC env check =="
          env | grep ACTIONS_ID_TOKEN || echo "❌ No OIDC env found"

          # Extra safety: ensure no lingering npmrc
          rm -f ~/.npmrc
          rm -f "$NPM_CONFIG_USERCONFIG" || true

          # 🔥 Kill token-based auth so OIDC is used
          unset NODE_AUTH_TOKEN
          unset NPM_TOKEN
          unset NPM_CONFIG_USERCONFIG

          echo "Auth-related env after cleanup:"
          env | grep -E 'NODE_AUTH|NPM_TOKEN|npmrc' || echo "OK: no token envs"

          echo "== Publishing =="
          pnpm publish --access public --no-git-checks --provenance

  # Publish the Tari Wallet Daemon client to the NPM registry
  publish-wallet-daemon-client:
    runs-on: ubuntu-latest
    needs: publish-typescript-bindings
    defaults:
      run:
        working-directory: clients/javascript/wallet_daemon_client
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build-dist
        name: "Build Bindings Dist"
        working-directory: bindings
      - run: pnpm run build
      - run: pnpm publish --access public --no-git-checks || echo "Publish failed (probably already published)"

  # Publish the Tari Indexer client to the NPM registry
  publish-indexer-client:
    runs-on: ubuntu-latest
    needs: publish-typescript-bindings
    defaults:
      run:
        working-directory: clients/javascript/indexer_client
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build-dist
        name: "Build Bindings Dist"
        working-directory: bindings
      - run: pnpm run build
      - run: pnpm publish --access public --no-git-checks || echo "Publish failed (probably already published)"

